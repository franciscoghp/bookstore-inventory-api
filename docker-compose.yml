services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: bookstore
      POSTGRES_DB: bookstore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore -d bookstore"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://bookstore:bookstore@db:5432/bookstore
      EXCHANGE_API_URL: https://api.exchangerate-api.com/v4/latest/USD
      PORT: "3000"
      EXCHANGE_API_TIMEOUT_MS: "4000"
      PROFIT_MARGIN_PERCENTAGE: "40"
      DEFAULT_EXCHANGE_RATE: "1"
      EXCHANGE_RATE_CACHE_TTL_SECONDS: "3600"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
